name: release_server

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA architectures: project defaults or SM120 only'
        type: choice
        default: all
        options:
          - all
          - sm120

permissions:
  contents: write

env:
  CUDA_VERSION: '13.3'
  CUDA_ARCH_FLAGS: ${{ inputs.cuda_arch == 'sm120' && '-DCMAKE_CUDA_ARCHITECTURES=120a-real' || '' }}
  CUDA_ARCH_SUFFIX: ${{ inputs.cuda_arch == 'sm120' && '-sm120' || '' }}
  CUDA_ARCH_LABEL: ${{ inputs.cuda_arch == 'sm120' && 'SM120 only' || 'default architectures' }}
  RELEASE_TAG: server-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  windows-cuda:
    name: Windows x64 CUDA 13 server
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json

      - name: Build server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_NATIVE=OFF ^
            -DBUILD_SHARED_LIBS=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_APP=OFF ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_UI=ON %CUDA_ARCH_FLAGS%
          if errorlevel 1 exit /b 1
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server

      - name: Pack server
        id: package
        shell: pwsh
        run: |
          $dst = New-Item -ItemType Directory -Path package
          Copy-Item build/bin/Release/llama-server.exe $dst
          Copy-Item build/bin/Release/*.dll $dst
          Copy-Item LICENSE, README.md $dst
          if (-not (Test-Path "$dst/ggml-cuda.dll")) {
            throw 'CUDA backend was not built'
          }

          $archive = "llama-$env:RELEASE_TAG-bin-win-cuda-$env:CUDA_VERSION-x64$env:CUDA_ARCH_SUFFIX.zip"
          7z a -tzip $archive ./package/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Pack CUDA runtime
        id: runtime
        shell: pwsh
        run: |
          $dst = New-Item -ItemType Directory -Path cudart
          $cudaDirs = @("$env:CUDA_PATH/bin", "$env:CUDA_PATH/bin/x64", "$env:CUDA_PATH/lib")
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            $files = @($cudaDirs | Where-Object { Test-Path $_ } | ForEach-Object {
              Get-ChildItem -Path $_ -Filter $pattern -File
            })
            if ($files.Count -eq 0) {
              throw "CUDA runtime DLL not found: $pattern"
            }
            $files | Copy-Item -Destination $dst -Force
          }

          $archive = "cudart-llama-bin-win-cuda-$env:CUDA_VERSION-x64.zip"
          7z a -tzip $archive ./cudart/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llama-${{ env.RELEASE_TAG }}-win-cuda-${{ env.CUDA_VERSION }}-x64${{ env.CUDA_ARCH_SUFFIX }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.runtime.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

      - name: Create release and upload packages
        uses: actions/github-script@v8
        env:
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
        with:
          script: |
            const fs = require('fs');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              name: `llama-server ${process.env.RELEASE_TAG} (Windows x64, CUDA ${process.env.CUDA_VERSION}, ${process.env.CUDA_ARCH_LABEL})`,
              body: 'Extract the server and CUDA runtime ZIP files into the same directory, then run llama-server.exe.',
              draft: true,
              prerelease: false,
            });
            for (const archive of [process.env.RELEASE_ARCHIVE, process.env.RUNTIME_ARCHIVE]) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name: archive,
                data: fs.readFileSync(archive),
              });
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: false,
            });
            await core.summary.addLink('Download release', published.html_url).write();
